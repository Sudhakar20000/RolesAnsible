  - name: install package
    package:  
      name: "{{ item }}"
      state: present
    loop:
      - python3 
      - gcc
      - python3-devel

  - name: add system user
    import_role:
      name: common
      tasks_from: add_user
 
  - name: add and remove directory
    import_role:
      name: common
      tasks_from: add_remove

  - name: install package
    pip:
      requirements: requirements.txt
      executable: pip3.9
    args:
      chdir: /app
  - name: copy the servic file
    import_role:
      name: common
      tasks_from: servicefilecopy
  - name: daemon_reload
    import_role: 
      name: common
      tasks_from: demon_servic
